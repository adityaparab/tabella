name: tabella

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tabella
    ports:
      - "5433:5432"
    volumes:
      - tabella_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tabella"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  tabella_pgdata:
